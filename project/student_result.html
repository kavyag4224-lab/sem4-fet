<!DOCTYPE html>
<html>
<head>
    <title>Student Result Management System</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f0f2f5;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 500px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            color: darkblue;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid black;
        }

        th {
            background-color: lightblue;
        }

        th, td {
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Student Result Management System</h2>

        <input type="text" id="name" placeholder="Enter Student Name">

        <input type="number" id="m1" placeholder="Enter Mark 1">

        <input type="number" id="m2" placeholder="Enter Mark 2">

        <input type="number" id="m3" placeholder="Enter Mark 3">

        <button onclick="addStudent()">Add Result</button>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Total</th>
                    <th>Average</th>
                    <th>Grade</th>
                </tr>
            </thead>

            <tbody id="resultTable">

            </tbody>
        </table>

    </div>

    <script>

        function addStudent() {

            let name = document.getElementById("name").value;

            let m1 = Number(document.getElementById("m1").value);

            let m2 = Number(document.getElementById("m2").value);

            let m3 = Number(document.getElementById("m3").value);

            let total = m1 + m2 + m3;

            let average = total / 3;

            let grade;

            if (average >= 90) {
                grade = "A";
            }
            else if (average >= 75) {
                grade = "B";
            }
            else if (average >= 50) {
                grade = "C";
            }
            else {
                grade = "Fail";
            }

            let table = document.getElementById("resultTable");

            let row = table.insertRow();

            row.insertCell(0).innerHTML = name;
            row.insertCell(1).innerHTML = total;
            row.insertCell(2).innerHTML = average.toFixed(2);
            row.insertCell(3).innerHTML = grade;

            document.getElementById("name").value = "";
            document.getElementById("m1").value = "";
            document.getElementById("m2").value = "";
            document.getElementById("m3").value = "";
        }

    </script>

</body>
</html>
